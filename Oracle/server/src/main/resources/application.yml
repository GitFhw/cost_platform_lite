spring:
  application:
    name: cost-lite-server
  main:
    banner-mode: "off"
  datasource:
    driver-class-name: ${COST_LITE_DB_DRIVER:oracle.jdbc.OracleDriver}
    url: ${COST_LITE_DB_URL:jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1}
    username: ${COST_LITE_DB_USERNAME:root}
    password: ${COST_LITE_DB_PASSWORD:}
    hikari:
      pool-name: cost-lite-pool
      minimum-idle: ${COST_LITE_DB_MIN_IDLE:1}
      maximum-pool-size: ${COST_LITE_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${COST_LITE_DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: 3000
      initialization-fail-timeout: -1
      leak-detection-threshold: ${COST_LITE_DB_LEAK_THRESHOLD:0}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${COST_LITE_SERVER_PORT:8080}
  servlet:
    context-path: ${COST_LITE_CONTEXT_PATH:/}
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: ${COST_LITE_TOMCAT_MAX_THREADS:100}
      min-spare: ${COST_LITE_TOMCAT_MIN_THREADS:10}

mybatis-plus:
  mapper-locations: classpath*:cost-lite/mapper/**/*Mapper.xml
  type-aliases-package: com.ruoyi.system.domain,com.ruoyi.common.core.domain

cost:
  dispatch:
    enabled: ${COST_LITE_DISPATCH_ENABLED:false}
    dispatch-interval-seconds: ${COST_LITE_DISPATCH_INTERVAL_SECONDS:15}
    stale-timeout-seconds: ${COST_LITE_DISPATCH_STALE_TIMEOUT_SECONDS:600}
    node-id: ${COST_LITE_NODE_ID:cost-lite-single}
  lite:
    embedded:
      enabled: false
    auth-enabled: ${COST_LITE_AUTH_ENABLED:false}
    admin-token: ${COST_LITE_ADMIN_TOKEN:}
    operator: ${COST_LITE_OPERATOR:lite-admin}
    max-page-size: ${COST_LITE_MAX_PAGE_SIZE:200}
    persist-billing-log: ${COST_LITE_PERSIST_BILLING_LOG:true}
    plugin-enabled: ${COST_LITE_PLUGIN_ENABLED:true}
    plugin-dir: ${COST_LITE_PLUGIN_DIR:plugins}
    dictionary:
      provider: ${COST_LITE_DICTIONARY_PROVIDER:SYSTEM}
      validation-enabled: ${COST_LITE_DICTIONARY_VALIDATION_ENABLED:true}
      allow-unconfigured-types: ${COST_LITE_DICTIONARY_ALLOW_UNCONFIGURED_TYPES:true}
      # 字典编码不一致时只需在外部 application.yml 覆盖下面两个映射。
      type-mappings: {}
      value-mappings: {}

logging:
  level:
    root: INFO
    com.ruoyi.lite: INFO
    com.ruoyi.system.service.impl.cost: INFO
    org.springframework.jdbc: WARN
    org.mybatis: WARN


---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    driver-class-name: ${COST_LITE_DB_DRIVER:oracle.jdbc.OracleDriver}
    url: ${COST_LITE_DB_URL}
    username: ${COST_LITE_DB_USERNAME}
    password: ${COST_LITE_DB_PASSWORD}
